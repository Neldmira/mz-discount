name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK de debug
        run: |
          DIR=$(dirname "$(find . -name settings.gradle | head -n 1)")
          echo "Projecto encontrado em: $DIR"
          gradle -p "$DIR" assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MozDiscount-APK
          path: '**/app-debug.apk'
