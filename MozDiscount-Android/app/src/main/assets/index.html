<!DOCTYPE html>
<html lang="pt-MZ"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moz Discount</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f6f6;--sf:#fff;--tx:#2b2022;--mu:#75686a;--ln:#ead6d9;--pr:#b2223a;--pt:#fff;--ac:#008a73;--wn:#a96308;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181416;--sf:#241d1f;--tx:#f4edef;--mu:#bcaeb1;--ln:#51343a;--pr:#df6474;--pt:#1b0b14;--ac:#43c9aa;--wn:#f0b354}}
:root[data-theme="dark"]{--bg:#181416;--sf:#241d1f;--tx:#f4edef;--mu:#bcaeb1;--ln:#51343a;--pr:#df6474;--pt:#1b0b14;--ac:#43c9aa;--wn:#f0b354}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:15px/1.4 Sora,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%;padding-bottom:84px}
body.signup-mode{padding-bottom:0}
main{max-width:620px;margin:0 auto;padding:12px 16px}
button,select,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.top{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:8px;margin:-12px -16px 12px;padding:8px 16px 10px;background:var(--bg);border-bottom:1px solid var(--ln)}
.hamburger{flex:none}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.brandmark{width:38px;height:38px;display:grid;place-items:center;flex:none;border-radius:12px;background:var(--pr);color:var(--pt)}
.brandmark svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brandcopy{min-width:0}.logo{font-weight:800;font-size:19px;line-height:1.1;flex:1}.logo b{color:var(--pr)}
.place{display:flex;align-items:center;gap:4px;margin-top:3px;color:var(--mu);font-size:11px;white-space:nowrap}.place svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top-actions{display:flex;align-items:center;gap:7px;flex:none}
.top-actions button[data-a="notif"],.top-actions button[data-a="set"]{display:none}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--sf);border:1px solid var(--ln);position:relative;color:var(--tx)}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:-4px;right:-4px;background:var(--pr);color:var(--pt);font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-weight:700}
h2{font-size:17px;margin:20px 0 10px;display:flex;justify-content:space-between;align-items:baseline}h2 small{color:var(--mu);font-weight:400;font-size:12px}
.sb{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--sf)}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--ln);background:var(--sf);font-size:13px;white-space:nowrap}
.chip.on{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:600}
.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.category-grid .chip{display:flex;align-items:center;justify-content:flex-start;gap:6px;min-width:0;min-height:42px;width:100%;padding:8px 10px;border-radius:11px;white-space:normal;text-align:left;line-height:1.2}
.bk{flex:none;width:76px;text-align:center;font-size:11px;color:var(--mu)}.bk .bd{margin:0 auto 4px}
.bank-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bank-grid .bk{width:auto;min-width:0;display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);text-align:left;font-size:12px}
.bank-grid .bd{width:38px;height:38px;border-radius:11px}
.bank-grid .bd i{width:15px;height:15px;right:-3px;bottom:-3px}
.bank-grid .bd i svg{width:9px;height:9px}
.bd{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;position:relative;flex:none}
.bd.s{width:40px;height:40px;font-size:12px;border-radius:12px}.bd.l{width:72px;height:72px;font-size:22px;border-radius:20px}
.bd i{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--sf);display:grid;place-items:center;border:1px solid var(--ln)}
.bd i svg{width:11px;height:11px;fill:none;stroke:var(--tx);stroke-width:2}
.bd.bank-logo{background-color:#fff!important;overflow:hidden;padding:0}
.bd.bank-logo img{display:block;width:100%;height:100%;object-fit:cover}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:10px;width:100%;text-align:left}
.card .in{flex:1;min-width:0}.card b{display:block;font-size:14px}.card span{font-size:12px;color:var(--mu)}
.pct{font-weight:800;font-size:18px;color:var(--pr);flex:none}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);font-weight:600;margin-top:4px}
.tag.w{background:color-mix(in srgb,var(--wn) 18%,transparent);color:var(--wn)}
.hotel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hc{width:100%;min-width:0;min-height:88px;text-align:center;background:var(--sf);border:1px solid var(--ln);border-radius:13px;padding:9px 7px}
.hc .bd{margin:0 auto 5px}.hc b{font-size:11px;display:block;overflow-wrap:anywhere;line-height:1.2}.hc span{color:var(--pr);font-weight:800;font-size:11px}
.nav{position:fixed;left:50%;transform:translateX(-50%);width:min(100%,620px);bottom:0;background:var(--sf);border:1px solid var(--ln);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -5px 22px rgba(20,12,40,.08);display:flex;justify-content:space-around;padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px));z-index:15}
.nav button{flex:1;min-width:0;max-width:112px;font-size:10px;color:var(--mu);padding:0 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-icon{width:44px;height:28px;display:grid;place-items:center;border-radius:11px;color:currentColor}
.nav-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button small{font-size:10px;line-height:1.2}.nav .on{color:var(--pr);font-weight:700}.nav .on .nav-icon{background:color-mix(in srgb,var(--pr) 12%,transparent)}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.fl select{padding:10px;border-radius:12px;border:1px solid var(--ln);background:var(--sf)}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln)}
.sw input{width:40px;height:22px;accent-color:var(--pr)}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.sheet{position:fixed;inset:0;background:rgba(10,5,25,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:var(--bg);width:100%;max-width:620px;max-height:88%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s}
.drawer-overlay{position:fixed;inset:0;z-index:30;display:flex;background:rgba(10,5,25,.5)}
.drawer{width:min(310px,86vw);height:100%;overflow:auto;background:var(--bg);padding:18px 14px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:8px 0 28px rgba(10,5,25,.18);animation:drawer-in .18s ease-out}
.drawer-head{display:flex;align-items:center;gap:10px;padding:4px 6px 18px;border-bottom:1px solid var(--ln);margin-bottom:12px}
.drawer-title{font-size:16px;font-weight:800}.drawer-subtitle{font-size:11px;color:var(--mu);margin-top:2px}
.drawer-label{margin:14px 8px 6px;color:var(--mu);font-size:10px;text-transform:uppercase;font-weight:700}
.drawer-item{width:100%;min-height:44px;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;text-align:left;color:var(--tx);font-size:14px}
.drawer-item svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--mu)}
.drawer-item:active,.drawer-item:hover{background:color-mix(in srgb,var(--pr) 11%,transparent);color:var(--pr)}
@keyframes drawer-in{from{transform:translateX(-20px);opacity:.7}to{transform:translateX(0);opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}}@media(prefers-reduced-motion:reduce){.sh{animation:none}}
.btn{padding:12px 16px;border-radius:14px;background:var(--pr);color:var(--pt);font-weight:700;flex:1;text-align:center;text-decoration:none;display:block}
.btn.o{background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
.acts{display:flex;gap:8px;margin-top:14px}
.kv{font-size:13px;color:var(--mu);margin-top:8px}.kv b{color:var(--tx)}
.map{width:100%;border-radius:18px;background:var(--sf);border:1px solid var(--ln)}
.tg{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:30}
.signup-main{width:100%;max-width:620px;min-height:100dvh;display:flex;align-items:center;padding:24px}
.signup-page{width:100%;max-width:420px;margin:auto}
.signup-mark{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:var(--pr);color:var(--pt);margin-bottom:30px}
.signup-mark svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.signup-eyebrow{font-size:12px;font-weight:700;color:var(--pr);margin-bottom:7px}
.signup-title{font-size:27px;line-height:1.15;font-weight:800;margin:0 0 9px}
.signup-copy{color:var(--mu);margin-bottom:24px}
.signup-field{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.signup-input{width:100%;border:1px solid var(--ln);border-radius:12px;background:var(--sf);padding:13px 14px;outline:none}
.signup-input:focus{border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 15%,transparent)}
.signup-submit{width:100%;border:0;border-radius:12px;background:var(--pr);color:var(--pt);font-weight:700;padding:13px 16px;margin-top:12px}
.signup-note{font-size:12px;color:var(--mu);margin-top:17px}
@media(max-width:480px){
body{font-size:14px;overflow-x:hidden;padding-bottom:78px}
main{width:100%;padding:10px 14px 18px}
.top{gap:6px;margin:0 -14px 10px;padding:8px 14px 10px}
.brand{gap:8px}.brandmark{width:36px;height:36px;border-radius:11px}.logo{font-size:18px}
.place{font-size:10px}.top-actions{gap:5px}.ib{width:34px;height:34px;border-radius:10px}.ib svg{width:17px;height:17px}
.hamburger{width:34px;height:34px}
.sb{padding:12px;border-radius:12px}
h2{font-size:16px;margin:18px 0 8px}
.row{margin-right:-14px;padding-right:14px}
.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.bk{width:70px;font-size:10px}
.bd{width:44px;height:44px;border-radius:13px}
.bd.l{width:64px;height:64px;border-radius:17px}
.hc{width:118px;border-radius:14px;padding:10px 7px}
.hc b{font-size:11px}
.card{gap:9px;padding:10px;border-radius:14px}
.card .pct{font-size:16px}
.nav{width:100%;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{max-width:none;font-size:10px;padding:0}
.nav-icon{width:42px;height:27px}.nav-icon svg{width:19px;height:19px}
.fl{gap:7px}
.fl select{min-width:0;font-size:12px;padding:9px 7px}
.sh{border-radius:20px 20px 0 0;padding:16px 15px calc(16px + env(safe-area-inset-bottom,0px))}
.signup-main{min-height:100svh;padding:24px 22px}
.signup-title{font-size:25px}
}
@media(max-width:360px){
main{padding-left:12px;padding-right:12px}
.row{margin-right:-12px;padding-right:12px}
.bk{width:64px}
.hc{width:108px}
.logo{font-size:18px}
.card .bd.s{width:36px;height:36px}
}

.sbw{position:relative}.sbw .sb{padding-right:44px}.sb::-webkit-search-cancel-button{display:none}.sbx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;color:var(--mu)}
.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:10px 0;padding:3px;background:var(--sf);border:1px solid var(--ln);border-radius:14px}.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;padding:8px 10px;border-radius:11px;font-size:13px;color:var(--mu)}.seg button.on{background:var(--pr);color:var(--pt);font-weight:700}
.finder{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-top:12px}.finder h2{margin:0 0 4px}
.big-sel,.fl select{width:100%;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}.fl select{background:var(--sf)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px;text-align:center;font-size:11px;color:var(--mu)}.stat b{display:block;font-size:20px;color:var(--pr)}
.cards-list{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}.cards-list .card{margin:0}h2.grp{margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips .chip,.kv .chip{padding:5px 10px;font-size:12px}
.pct.long{font-size:12px;max-width:38%;text-align:right;line-height:1.25}.card .tag{margin-right:4px}.bank-grid .bk span{color:var(--tx)}.map{max-height:340px}
@media(min-width:720px){main{max-width:900px;padding:16px 24px}.top{margin:-16px -24px 16px;padding:10px 24px}.cards-list{grid-template-columns:repeat(2,minmax(0,1fr))}.bank-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.fl{grid-template-columns:repeat(3,minmax(0,1fr))}.stat b{font-size:24px}}
@media(min-width:1000px){body{padding:0 0 0 96px}main{max-width:1180px}.cards-list{grid-template-columns:repeat(3,minmax(0,1fr))}.bank-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.nav{left:0;top:0;bottom:0;transform:none;width:96px;flex-direction:column;justify-content:flex-start;gap:8px;padding:18px 6px;border:0;border-right:1px solid var(--ln);border-radius:0;box-shadow:none}.nav button{flex:none;max-width:none;padding:6px 0}
